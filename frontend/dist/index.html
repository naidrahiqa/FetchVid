<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FetchVid</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#09090b;--bg2:#18181b;--bg3:#27272a;--bg4:#3f3f46;
  --fg:#fafafa;--fg2:#a1a1aa;--fg3:#71717a;
  --ac:#8b5cf6;--ac2:#a78bfa;--ac3:#7c3aed;--ac-glow:rgba(139,92,246,.15);
  --ok:#22c55e;--err:#ef4444;--warn:#eab308;
  --radius:10px;--radius-sm:6px;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
  --shadow-lg:0 10px 30px rgba(0,0,0,.4);
  --transition:all .2s cubic-bezier(.4,0,.2,1);
}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden;height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--fg3)}

/* Header */
.header{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.logo{display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo-icon{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--ac),var(--ac3));display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700;box-shadow:0 0 12px var(--ac-glow)}
.logo-text{font-size:15px;font-weight:700;color:var(--fg);letter-spacing:-.3px}
.logo-ver{font-size:10px;color:var(--fg3);font-weight:500}

.url-box{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:0 12px;transition:var(--transition)}
.url-box:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-glow)}
.url-box input{flex:1;background:none;border:none;color:var(--fg);font-size:13px;padding:9px 0;outline:none;font-family:inherit}
.url-box input::placeholder{color:var(--fg3)}

.btn{padding:7px 14px;border-radius:var(--radius-sm);border:none;font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:inherit;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:var(--ac2);box-shadow:0 0 16px var(--ac-glow)}.btn-p:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-s{background:var(--bg3);color:var(--fg2)}.btn-s:hover{background:var(--bg4);color:var(--fg)}

/* Settings row */
.settings{display:flex;align-items:center;gap:8px;padding:0 16px 10px}
.settings-label{font-size:11px;color:var(--fg3);font-weight:500;white-space:nowrap}
.folder-input{flex:1;background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius-sm);padding:6px 10px;color:var(--fg2);font-size:11px;font-family:inherit;outline:none}
.ibtn{padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--bg3);background:var(--bg2);color:var(--fg2);font-size:12px;cursor:pointer;transition:var(--transition);font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.ibtn:hover{background:var(--bg3);color:var(--fg);border-color:var(--bg4)}

/* Tabs */
.tabs{display:flex;gap:6px;padding:0 16px 10px}
.tab{padding:6px 20px;border-radius:20px;border:1px solid var(--bg3);font-size:11px;font-weight:600;cursor:pointer;background:transparent;color:var(--fg3);transition:var(--transition);font-family:inherit;letter-spacing:.3px}
.tab:hover{background:var(--bg3);color:var(--fg2)}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 0 12px var(--ac-glow)}

/* Panel */
.panel{flex:1;display:flex;flex-direction:column;margin:0 12px;border-radius:var(--radius);background:var(--bg2);border:1px solid var(--bg3);overflow:hidden;min-height:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bg3)}
.panel-h .title{font-size:12px;color:var(--fg2);font-weight:500}
.panel-h .title strong{color:var(--fg);font-weight:700}
.panel-h .acts{display:flex;gap:12px}
.act-btn{background:none;border:none;font-size:11px;cursor:pointer;color:var(--fg3);padding:0;font-weight:500;transition:var(--transition);font-family:inherit}
.act-btn:hover{color:var(--ac)}
.act-btn.danger:hover{color:var(--err)}

#vlist{flex:1;overflow-y:auto;padding:4px 0}
.vid{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:12px;cursor:pointer;transition:var(--transition);border-bottom:1px solid transparent}
.vid:hover{background:rgba(139,92,246,.05);border-bottom-color:var(--bg3)}
.vid:last-child{border-bottom:none}
.vid input[type=checkbox]{accent-color:var(--ac);width:14px;height:14px;cursor:pointer}
.vid .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg);font-weight:500}
.badge{font-size:9px;padding:2px 7px;border-radius:4px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.empty{text-align:center;color:var(--fg3);font-size:12px;padding:50px 20px;line-height:1.8}

/* Download bar */
.dlbar{display:flex;align-items:center;gap:10px;padding:10px 16px}
.dlbar label{font-size:11px;color:var(--fg3);font-weight:500}
.dlbar input[type=number]{width:46px;padding:5px;border-radius:var(--radius-sm);background:var(--bg2);border:1px solid var(--bg3);color:var(--fg);font-size:12px;text-align:center;outline:none;font-family:inherit;transition:var(--transition)}
.dlbar input[type=number]:focus{border-color:var(--ac)}
#btnDL{margin-left:auto;padding:9px 24px;border-radius:var(--radius-sm);border:none;background:linear-gradient(135deg,var(--ac),var(--ac3));color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:var(--transition);font-family:inherit;letter-spacing:.3px;box-shadow:0 2px 10px var(--ac-glow)}
#btnDL:hover{box-shadow:0 4px 20px rgba(139,92,246,.35);transform:translateY(-1px)}
#btnDL:active{transform:translateY(0) scale(.98)}
#btnDL:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

/* Progress */
#progWrap{display:none;padding:0 16px 6px}#progWrap.show{display:block}
.prog-h{display:flex;justify-content:space-between;margin-bottom:4px}.prog-h span{font-size:11px;color:var(--fg3);font-weight:500}
.prog-t{height:5px;border-radius:10px;background:var(--bg3);overflow:hidden}
.prog-f{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s;width:0%;box-shadow:0 0 8px var(--ac-glow)}

/* Log */
#logBox{height:100px;background:var(--bg2);border-top:1px solid var(--bg3);overflow-y:auto;font-size:11px;font-family:'Cascadia Code','Fira Code','SF Mono',monospace;padding:8px 14px;display:flex;flex-direction:column;gap:1px}
.ll{color:var(--fg3);line-height:1.7;padding:1px 0}
.ll.ok{color:var(--ok)}.ll.er{color:var(--err)}.ll.wn{color:var(--warn)}.ll.in{color:var(--ac2)}

/* Modal */
.modal-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;justify-content:center;align-items:center}
.modal-mask.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bg3);border-radius:14px;padding:20px;width:520px;max-height:80vh;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-lg)}
.modal h3{font-size:14px;color:var(--fg);margin:0;font-weight:600}
.modal .sc{padding:12px;border-radius:var(--radius);background:var(--bg);border:1px solid var(--bg3);cursor:pointer;transition:var(--transition)}
.modal .sc:hover{border-color:var(--ac);background:var(--ac-glow)}
.modal .sc .sl{font-size:12px;font-weight:600;color:var(--ac2);margin-bottom:3px}
.modal .sc .sd{font-size:11px;color:var(--fg2);margin-bottom:6px;line-height:1.4}
.modal .sc .ss{font-size:10px;font-family:'Cascadia Code','Fira Code',monospace;color:var(--fg3);white-space:pre-wrap;word-break:break-all;max-height:50px;overflow:hidden;line-height:1.5}
.modal .sc.copied{border-color:var(--ok);box-shadow:0 0 0 2px rgba(34,197,94,.2)}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.vid{animation:fadeIn .2s ease}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">F</div>
    <div>
      <div class="logo-text">FetchVid</div>
    </div>
  </div>
  <div class="url-box">
    <input id="urlInput" type="text" placeholder="Paste URL profile, share link, atau reel URL...">
  </div>
  <button id="btnExtract" class="btn btn-p">Ambil Daftar Video</button>
  <button id="btnScripts" class="btn btn-s">Scripts</button>
</div>

<div class="settings">
  <span class="settings-label">Simpan ke</span>
  <input id="folderPath" class="folder-input" type="text" readonly>
  <button id="btnFolder" class="ibtn">Browse</button>
  <button id="btnCookies" class="ibtn">Cookies</button>
</div>

<div class="tabs">
  <button class="tab on" data-p="facebook">Facebook</button>
  <button class="tab" data-p="instagram">Instagram</button>
  <button class="tab" data-p="tiktok">TikTok</button>
</div>

<div class="panel">
  <div class="panel-h">
    <span class="title">Video: <strong id="cnt">0</strong></span>
    <div class="acts">
      <button id="btnAll" class="act-btn">Select All</button>
      <button id="btnNone" class="act-btn">Deselect</button>
      <button id="btnPaste" class="act-btn">Paste URLs</button>
      <button id="btnClr" class="act-btn danger">Clear</button>
    </div>
  </div>
  <div id="vlist"><div class="empty">Belum ada video.<br>Paste URL atau klik "Ambil Daftar Video"</div></div>
</div>

<div class="dlbar">
  <label>Concurrent:</label>
  <input id="conc" type="number" value="3" min="1" max="10">
  <label>video sekaligus</label>
  <button id="btnDL" disabled>DOWNLOAD</button>
</div>

<div id="progWrap">
  <div class="prog-h"><span id="pTxt">0 / 0</span><span id="pPct">0%</span></div>
  <div class="prog-t"><div id="pBar" class="prog-f"></div></div>
</div>

<div id="logBox"><div class="ll in">FetchVid siap. Masukkan URL profile untuk memulai.</div></div>

<div id="scriptModal" class="modal-mask" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal">
    <h3>Console Scripts</h3>
    <div id="scriptList"></div>
    <button class="btn btn-s" style="align-self:flex-end" onclick="document.getElementById('scriptModal').classList.remove('show')">Tutup</button>
  </div>
</div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var urlI=$('#urlInput'),vlist=$('#vlist'),cnt=$('#cnt'),conc=$('#conc'),
    btnDL=$('#btnDL'),btnEx=$('#btnExtract'),btnSc=$('#btnScripts'),
    btnP=$('#btnPaste'),btnC=$('#btnClr'),btnA=$('#btnAll'),btnN=$('#btnNone'),
    btnF=$('#btnFolder'),btnK=$('#btnCookies'),folderI=$('#folderPath'),
    tabs=document.querySelectorAll('.tab'),
    logB=$('#logBox'),pW=$('#progWrap'),pB=$('#pBar'),pT=$('#pTxt'),pP=$('#pPct');

var vids=[],running=false;

function L(m,t){var d=document.createElement('div');d.className='ll'+(t?' '+t:'');d.textContent=m;logB.appendChild(d);logB.scrollTop=99999}
function go(fn,arg){if(arg===undefined||arg===null)return window['go']['app']['App'][fn]();return window['go']['app']['App'][fn](arg)}
function evOn(e,cb){window.runtime.EventsOn(e,cb)}

tabs.forEach(function(t){t.onclick=function(){tabs.forEach(function(x){x.classList.remove('on')});t.classList.add('on')}});

function render(arr){
  vids=arr;vlist.innerHTML='';cnt.textContent=arr.length;
  if(!arr.length){vlist.innerHTML='<div class="empty">Belum ada video.</div>';btnDL.disabled=true;return}
  arr.forEach(function(v,i){
    var d=document.createElement('div');d.className='vid';d.dataset.i=i;
    var cb=document.createElement('input');cb.type='checkbox';cb.checked=true;
    var lb=document.createElement('span');lb.className='t';lb.textContent=(v.Title||v.title||v.URL||v.url||'').slice(0,80);
    var bg=document.createElement('span');bg.className='badge';
    var src=v.Source||v.source||'';
    var C={facebook:'#1877f2',instagram:'#e4405f',tiktok:'#00f2ea'};
    bg.style.background=(C[src]||'#555')+'22';bg.style.color=C[src]||'#aaa';
    bg.textContent=(src||'?').slice(0,2).toUpperCase();
    d.appendChild(cb);d.appendChild(lb);d.appendChild(bg);vlist.appendChild(d);
  });
  btnDL.disabled=false;
}

function sel(){
  var s=[];
  vlist.querySelectorAll('.vid').forEach(function(d){
    var cb=d.querySelector('input');
    if(cb&&cb.checked)s.push(vids[parseInt(d.dataset.i)]);
  });
  return s;
}

btnA.onclick=function(){vlist.querySelectorAll('input').forEach(function(c){c.checked=true})};
btnN.onclick=function(){vlist.querySelectorAll('input').forEach(function(c){c.checked=false})};
btnC.onclick=function(){render([]);L('List dibersihkan','wn')};

btnP.onclick=function(){
  var t=prompt('Paste URL video (1 per baris):');
  if(!t)return;
  var lines=t.split('\n').map(function(s){return s.trim()}).filter(function(s){return s&&!s.startsWith('#')});
  var arr=[];
  lines.forEach(function(u){
    var src=detect(u);
    if(src!=='unknown')arr.push({URL:u,Title:u.split('/').pop()||u.slice(0,50),Source:src});
  });
  if(arr.length){render(vids.concat(arr));L('Ditambahkan '+arr.length+' URL','ok')}
};

function detect(u){
  if(/facebook\.com|fb\.com|fb\.watch/i.test(u))return'facebook';
  if(/instagram\.com|instagr\.am/i.test(u))return'instagram';
  if(/tiktok\.com|vm\.tiktok/i.test(u))return'tiktok';
  return'unknown';
}

btnSc.onclick=function(){
  go('GetScripts').then(function(s){
    var sl=$('#scriptList');sl.innerHTML='';
    if(!s||!s.length){sl.innerHTML='<div style="color:var(--fg3);font-size:12px">Tidak ada script.</div>';document.getElementById('scriptModal').classList.add('show');return}
    s.forEach(function(x,i){
      var d=document.createElement('div');d.className='sc';
      d.innerHTML='<div class="sl">['+x.label+']</div><div class="sd">'+x.desc+'</div><div class="ss">'+x.script+'</div>';
      d.onclick=function(){
        if(navigator.clipboard){navigator.clipboard.writeText(x.script)}
        else{var ta=document.createElement('textarea');ta.value=x.script;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)}
        d.classList.add('copied');L('Copied: '+x.label,'ok');
        setTimeout(function(){d.classList.remove('copied')},1500);
      };
      sl.appendChild(d);
    });
    document.getElementById('scriptModal').classList.add('show');
  }).catch(function(e){L('Error: '+e,'er')});
};

btnEx.onclick=function(){
  var url=urlI.value.trim();
  if(!url){L('Masukkan URL profile!','er');return}
  L('Analisa: '+url,'in');
  btnEx.disabled=true;btnEx.textContent='Loading...';
  go('ExtractURLs',url).then(function(r){
    if(!r.success){L(r.message,'er');return}
    var d=r.data||[];
    if(!d.length){L(r.message||'Tidak ada video','wn');return}
    render(d);L('Ditemukan '+d.length+' video','ok');
  }).catch(function(e){L('Error: '+e,'er')})
  .finally(function(){btnEx.disabled=false;btnEx.textContent='Ambil Daftar Video'});
};

btnDL.onclick=function(){
  if(running)return;
  var s=sel();
  if(!s.length){L('Pilih video!','wn');return}
  running=true;btnDL.textContent='DOWNLOADING...';btnDL.disabled=true;
  pW.classList.add('show');
  go('QueueDownload',s).then(function(r){
    if(!r.success){L('Gagal: '+r.message,'er');resetDl();return}
    L('Mulai download '+s.length+' video (bareng '+conc.value+')...','in');
    return go('StartDownload',parseInt(conc.value)||3);
  }).then(function(r){
    if(r&&!r.success){L('Gagal: '+r.message,'er');resetDl()}
  }).catch(function(e){L('Error: '+e,'er');resetDl()});
};

function resetDl(){running=false;btnDL.textContent='DOWNLOAD';btnDL.disabled=false}

evOn('download-progress',function(p){
  pB.style.width=(p.percent||0)+'%';
  pT.textContent=(p.completed||0)+' / '+(p.total||0);
  pP.textContent=Math.round(p.percent||0)+'%';
});
evOn('download-job-done',function(j){
  if(j.Error)L('['+j.Index+'] GAGAL: '+(j.Title||'')+' - '+j.Error,'er');
  else L('['+j.Index+'] SELESAI: '+(j.Title||''),'ok');
});
evOn('download-complete',function(p){
  L('Selesai! '+(p.success||0)+' berhasil, '+(p.failed||0)+' gagal','ok');
  resetDl();pW.classList.remove('show');
});

btnF.onclick=function(){
  go('SelectFolder').then(function(d){
    if(d){folderI.value=d;L('Folder: '+d,'in')}
  }).catch(function(e){L('Error: '+e,'er')});
};
btnK.onclick=function(){go('SelectCookiesFile').then(function(f){if(f)L('Cookies: '+f,'in')}).catch(function(e){L('Error: '+e,'er')})};

go('GetSettings').then(function(s){
  if(s&&s.OutputDir)folderI.value=s.OutputDir;
}).catch(function(){});

L('FetchVid siap. Masukkan URL profile untuk memulai.');
})();
</script>
</body>
</html>
